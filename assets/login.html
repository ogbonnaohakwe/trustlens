<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Login | TrustLenAI</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #060B13;
            overflow-x: hidden;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(13, 21, 32, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(229, 9, 20, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .animate-fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "secondary-fixed": "#2E090F",
                      "surface-container-low": "#070B11",
                      "surface-container-high": "#0F172A",
                      "on-error": "#ffffff",
                      "surface-variant": "#0D1520",
                      "on-tertiary-fixed": "#2b1701",
                      "on-primary-fixed-variant": "#94A3B8",
                      "error-container": "#7F1D1D",
                      "surface-tint": "#E50914",
                      "surface-container": "#0D1520",
                      "inverse-on-surface": "#060B13",
                      "surface-container-highest": "#1E293B",
                      "on-surface-variant": "#94A3B8",
                      "primary-fixed": "#d6e3ff",
                      "surface-bright": "#0D1520",
                      "on-tertiary-fixed-variant": "#5d4124",
                      "on-primary-container": "#CBD5E1",
                      "primary-fixed-dim": "#b9c7e4",
                      "inverse-primary": "#b9c7e4",
                      "background": "#060B13",
                      "outline": "#475569",
                      "tertiary-container": "#2b1701",
                      "surface-dim": "#070B11",
                      "secondary-container": "#2E090F",
                      "surface-container-lowest": "#060B13",
                      "secondary": "#E50914",
                      "on-secondary-fixed": "#ffffff",
                      "on-surface": "#ffffff",
                      "primary": "#ffffff",
                      "on-secondary-container": "#ffffff",
                      "tertiary-fixed-dim": "#e7bf99",
                      "on-error-container": "#ffffff",
                      "error": "#EF4444",
                      "surface": "#0D1520",
                      "on-primary-fixed": "#ffffff",
                      "primary-container": "#0D1520",
                      "secondary-fixed-dim": "#ffb4aa",
                      "on-tertiary-container": "#9f7d5b",
                      "on-primary": "#ffffff",
                      "on-tertiary": "#ffffff",
                      "tertiary-fixed": "#ffdcbd",
                      "tertiary": "#ffffff",
                      "inverse-surface": "#CBD5E1",
                      "outline-variant": "#1E293B",
                      "on-secondary": "#ffffff",
                      "on-background": "#CBD5E1",
                      "on-secondary-fixed-variant": "#ffffff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "xs": "8px",
                      "base": "4px",
                      "lg": "48px",
                      "xl": "80px",
                      "sm": "16px",
                      "margin-desktop": "40px",
                      "gutter": "24px",
                      "margin-mobile": "16px",
                      "md": "24px"
              },
              "fontFamily": {
                      "body-lg": ["Inter"],
                      "headline-md": ["Inter"],
                      "label-md": ["Inter"],
                      "headline-lg": ["Inter"],
                      "body-md": ["Inter"],
                      "label-bold": ["Inter"],
                      "headline-xl": ["Inter"],
                      "headline-lg-mobile": ["Inter"],
                      "caption": ["Inter"]
              },
              "fontSize": {
                      "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                      "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                      "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                      "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "label-bold": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                      "headline-xl": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                      "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                      "caption": ["12px", {"lineHeight": "16px", "fontWeight": "400"}]
              }
            },
          },
        }
      </script>
    <style>
        body {
          min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col justify-between">
<!-- Subtle Background Elements -->
<div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-24 -right-24 w-96 h-96 bg-surface-container-high rounded-full opacity-10 blur-3xl"></div>
    <div class="absolute bottom-0 left-0 w-[500px] h-[500px] bg-[#2E090F] rounded-full opacity-10 blur-3xl translate-y-1/2 -translate-x-1/4"></div>
</div>
<!-- Main Content Area -->
<main class="flex-grow flex items-center justify-center px-margin-mobile md:px-margin-desktop py-lg">
    <div class="w-full max-w-md animate-fade-in">
        <!-- Branding Section -->
        <div class="flex flex-col items-center mb-xl text-center">
            <div class="mb-sm flex items-center justify-center w-20 h-20 bg-transparent rounded-2xl">
                <img src="tplus.png" class="w-20 h-20 object-contain" alt="TrustLenAI Logo" onerror="this.src='assets/tplus.png'" />
            </div>
            <h1 class="font-headline-xl text-headline-xl text-white tracking-tight mb-xs">TrustLenAI</h1>
            <p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px]">Your Personal Product Safety Assistant</p>
        </div>
        <!-- Login Card -->
        <div class="glass-card rounded-xl p-md shadow-lg">
            <form class="space-y-md" id="loginForm">
                <!-- Input Group -->
                <div class="space-y-xs">
                    <label class="font-label-bold text-label-bold text-white uppercase tracking-wider ml-1" for="email">Email Address</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none text-outline group-focus-within:text-secondary transition-colors">
                            <span class="material-symbols-outlined">mail</span>
                        </div>
                        <input class="w-full bg-[#0F172A] border border-[#1E293B] text-white rounded-lg py-4 pl-12 pr-md font-body-md text-body-md focus:ring-2 focus:ring-secondary focus:border-secondary transition-all placeholder:text-[#475569] outline-none" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
                    </div>
                </div>
                <!-- CTA Button -->
                <button class="w-full bg-secondary hover:bg-red-700 text-on-secondary font-headline-md text-headline-md py-4 rounded-lg shadow-md active:scale-[0.98] transition-all flex items-center justify-center gap-sm group" type="submit">
                    CONTINUE
                    <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
                </button>
            </form>
            <!-- Status/Security Badge -->
            <div class="mt-md pt-md border-t border-[#1E293B] flex items-center justify-center gap-xs">
                <span class="material-symbols-outlined text-sm text-secondary">verified_user</span>
                <span class="font-caption text-caption text-on-surface-variant">Secure, encrypted connection</span>
            </div>
        </div>
    </div>
</main>
<!-- Footer Links -->
<footer class="pb-xl px-margin-mobile flex flex-col md:flex-row items-center justify-center gap-md">
    <a class="font-label-md text-label-md text-on-surface-variant hover:text-white transition-colors hover:underline underline-offset-4 cursor-pointer" onclick="showPrivacyPolicy()">Privacy Policy</a>
    <div class="hidden md:block w-1 h-1 bg-[#1E293B] rounded-full"></div>
    <a class="font-label-md text-label-md text-on-surface-variant hover:text-white transition-colors hover:underline underline-offset-4 cursor-pointer" onclick="showTerms()">Terms of Service</a>
    <div class="hidden md:block w-1 h-1 bg-[#1E293B] rounded-full"></div>
    <span class="font-label-md text-label-md text-outline">© 2026 TrustLenAI | Built by Bigthink Digital Creations</span>
</footer>
<!-- Interactive Layer -->
<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        const originalContent = btn.innerHTML;
        const email = document.getElementById('email').value;

        // Micro-interaction for feedback
        btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> SECURING...';
        btn.disabled = true;
        btn.classList.add('opacity-80');

        setTimeout(() => {
            btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> READY';
            btn.classList.replace('bg-secondary', 'bg-[#060B13]');
            btn.classList.replace('hover:bg-red-700', 'hover:bg-[#060B13]');

            // Pass control back to Flutter app over secure JS channel message
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.disabled = false;
                btn.classList.replace('bg-[#060B13]', 'bg-secondary');
                btn.classList.replace('hover:bg-[#060B13]', 'hover:bg-red-700');
                btn.classList.remove('opacity-80');
                if (window.AndroidInterface && window.AndroidInterface.postMessage) {
                    window.AndroidInterface.postMessage(JSON.stringify({
                        action: 'login',
                        email: email
                    }));
                }
            }, 1000);
        }, 2000);
    });

    function showPrivacyPolicy() {
        if (window.AndroidInterface && window.AndroidInterface.postMessage) {
            window.AndroidInterface.postMessage(JSON.stringify({
                action: 'privacy_policy'
            }));
        }
    }

    function showTerms() {
        if (window.AndroidInterface && window.AndroidInterface.postMessage) {
            window.AndroidInterface.postMessage(JSON.stringify({
                action: 'terms_of_service'
            }));
        }
    }

    // Atmosphere Effect: Floating red neon particles
    const container = document.createElement('div');
    container.className = 'fixed inset-0 pointer-events-none z-[-1]';
    document.body.appendChild(container);

    for (let i = 0; i < 15; i++) {
        const dot = document.createElement('div');
        dot.className = 'absolute bg-secondary opacity-5 rounded-full';
        const size = Math.random() * 8 + 4;
        dot.style.width = size + 'px';
        dot.style.height = size + 'px';
        dot.style.left = Math.random() * 100 + 'vw';
        dot.style.top = Math.random() * 100 + 'vh';
        dot.animate([
            { transform: 'translateY(0) translateX(0)' },
            { transform: `translateY(${(Math.random() - 0.5) * 80}px) translateX(${(Math.random() - 0.5) * 80}px)` }
        ], {
            duration: 6000 + Math.random() * 6000,
            iterations: Infinity,
            direction: 'alternate',
            easing: 'ease-in-out'
        });
        container.appendChild(dot);
    }
</script>
</body>
</html>
