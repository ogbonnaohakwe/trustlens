name: trustlens_ai
description: TrustLens AI product safety assistant rewritten in Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  http: ^1.2.2
  webview_flutter: ^4.8.0
  camera: ^0.10.6
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  flutter_markdown: ^0.7.3
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
    - assets/login.html
    - assets/voice_agent.html
    - assets/tplus.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "tplus.png"
